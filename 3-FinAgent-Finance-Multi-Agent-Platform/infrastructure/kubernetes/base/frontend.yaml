apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/component: ui}
spec:
  replicas: 2
  selector:
    matchLabels: {app.kubernetes.io/name: frontend}
  template:
    metadata:
      labels: {app.kubernetes.io/name: frontend, app.kubernetes.io/component: ui}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: ui
          image: finagent-frontend
          ports: [{name: http, containerPort: 3020}]
          env:
            - {name: API_INTERNAL_URL, value: "http://api:8020"}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: cache, mountPath: /app/.next/cache}]
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
        - {name: cache, emptyDir: {sizeLimit: 256Mi}}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: {app.kubernetes.io/name: frontend}
  ports: [{name: http, port: 3020, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: frontend
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: frontend}
