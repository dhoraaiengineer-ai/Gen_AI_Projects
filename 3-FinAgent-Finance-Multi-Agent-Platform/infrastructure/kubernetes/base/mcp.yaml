# MCP servers (ADR-036): one Deployment + Service per server; only the API calls /mcp.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-market
  labels: {app.kubernetes.io/name: mcp-market, app.kubernetes.io/component: mcp}
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels: {app.kubernetes.io/name: mcp-market}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app.kubernetes.io/name: mcp-market, app.kubernetes.io/component: mcp}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001
      containers:
        - name: mcp
          image: finagent-backend
          args: ["python", "-m", "src.mcp.run", "market", "--host", "0.0.0.0"]
          ports: [{name: http, containerPort: 8021}]
          envFrom:
            - configMapRef: {name: finagent-config}
            - secretRef: {name: finagent-secrets}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            failureThreshold: 3
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 36
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts: [{name: tmp, mountPath: /tmp}]
      volumes: [{name: tmp, emptyDir: {sizeLimit: 256Mi}}]
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-market
  labels: {app.kubernetes.io/name: mcp-market, app.kubernetes.io/component: mcp}
spec:
  selector: {app.kubernetes.io/name: mcp-market}
  ports: [{name: http, port: 8021, targetPort: http}]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: mcp-market
spec:
  minAvailable: 1
  selector:
    matchLabels: {app.kubernetes.io/name: mcp-market}
---
