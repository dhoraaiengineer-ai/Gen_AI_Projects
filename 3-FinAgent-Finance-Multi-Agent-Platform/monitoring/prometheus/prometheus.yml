# Prometheus for the compose stack (port 9020). Kubernetes uses the ServiceMonitor instead.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files: ["/etc/prometheus/alerts.yml"]

scrape_configs:
  - job_name: finagent-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8020"]
        labels: {service: api}
  # Each MCP server is its own process: tool calls, tool latency and ML inference happen there.
  - job_name: finagent-mcp
    metrics_path: /metrics
    static_configs:
      - targets: ["mcp-market:8021"]
        labels: {service: mcp, mcp_server: market}
      - targets: ["mcp-finance:8022"]
        labels: {service: mcp, mcp_server: finance}
      - targets: ["mcp-risk:8023"]
        labels: {service: mcp, mcp_server: risk}
      - targets: ["mcp-research:8024"]
        labels: {service: mcp, mcp_server: research}
      - targets: ["mcp-portfolio:8025"]
        labels: {service: mcp, mcp_server: portfolio}
      - targets: ["mcp-ml:8026"]
        labels: {service: mcp, mcp_server: ml}
