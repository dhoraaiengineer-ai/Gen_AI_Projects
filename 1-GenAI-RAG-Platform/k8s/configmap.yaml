# Non-secret settings. Secrets (EURI_API_KEY, DATABASE_URL, GEMINI_API_KEY, GROQ_API_KEY, TAVILY_API_KEY) live in the `rag-secrets` Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: rag-config
  labels:
    app.kubernetes.io/name: rag-api
data:
  ENVIRONMENT: prod
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  METRICS_PORT: "9090"

  LLM_BASE_URL: https://api.euron.one/api/v1/euri
  LLM_MODEL: gpt-4.1-nano
  LLM_FALLBACK_MODEL: gemini-2.0-flash
  AGENT_FALLBACK_MODEL: gpt-4o-mini
  LLM_TEMPERATURE: "0.2"
  LLM_MAX_TOKENS: "1024"
  LLM_MAX_RETRIES: "1"
  EMBEDDING_MODEL: text-embedding-3-small
  EMBEDDING_DIM: "1536"

  COLLECTION_NAME: documents
  CHUNKING_STRATEGY: "recursive"
  MAX_UPLOAD_MB: "20"
  GOLDEN_QUESTIONS_PER_DOCUMENT: "3"
  CHUNK_SIZE: "1000"
  CHUNK_OVERLAP_PCT: "15"
  TOP_K: "4"
  REDIS_URL: redis://redis:6379/0  # in-cluster Redis (k8s/redis.yaml); no password, reachable only from rag-api
  AGENT_MAX_ITERATIONS: "6"

  AUTH_ENABLED: "true"
  SUPABASE_URL: https://YOUR-PROJECT.supabase.co
  SUPABASE_PUBLISHABLE_KEY: YOUR_PUBLISHABLE_KEY # public by design
