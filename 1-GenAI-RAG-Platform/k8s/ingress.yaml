# Public entry point: an internet-facing AWS Application Load Balancer, created by the
# AWS Load Balancer Controller (installed by Terraform).
#
# HTTPS: request an ACM certificate for your domain in ap-northeast-1, then add
#   alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:ap-northeast-1:<acct>:certificate/<id>
#   alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
#   alb.ingress.kubernetes.io/ssl-redirect: "443"
# Until then the ALB serves plain HTTP. Don't use real credentials over plain HTTP.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-api
  labels:
    app.kubernetes.io/name: rag-api
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /health/ready
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    # Research-mode requests can take a while; ALB's default idle timeout is 60s.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=180
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-api
                port:
                  name: http
