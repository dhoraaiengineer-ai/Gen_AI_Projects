# Local Prometheus (docker compose --profile monitoring). On EKS, kube-prometheus-stack
# discovers the app through k8s/servicemonitor.yaml instead.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: rag-api
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
