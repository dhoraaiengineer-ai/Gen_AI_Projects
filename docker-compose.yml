# Local container runs.
#
#   docker compose up --build                     # app (+ Redis cache/memory) against Supabase (DATABASE_URL from .env)
#   docker compose --profile local-db up --build  # also app-local on :8001 against a local pgvector
#   docker compose --profile monitoring up -d     # + Prometheus (:9090) and Grafana (:3000)
#
# Secrets come from .env at runtime; they are never baked into the image.

x-app: &app
  build: .
  image: genai-rag-platform:local
  env_file: .env
  environment:
    LOG_FORMAT: json
    REDIS_URL: redis://redis:6379/0
  read_only: true  # the app writes nothing to disk; catches accidental writes early
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  stop_grace_period: 30s
  restart: unless-stopped

services:
  app:
    <<: *app
    container_name: rag-app
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  # Cache + short-term conversation memory. Pure cache: no persistence, so a restart just empties it
  # (long-term memory lives in Postgres).
  redis:
    image: redis:7.4-alpine
    container_name: rag-redis
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    read_only: true
    tmpfs:
      - /data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "6379:6379"  # so a non-Docker local run can use it too: REDIS_URL=redis://localhost:6379/0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app-local:
    <<: *app
    container_name: rag-app-local
    profiles: ["local-db"]
    environment:
      LOG_FORMAT: json
      DATABASE_URL: postgresql+psycopg://rag:rag@pgvector:5432/rag
      REDIS_URL: redis://redis:6379/1  # separate Redis database from the Supabase-backed app
    ports:
      - "8001:8000"
    depends_on:
      pgvector:
        condition: service_healthy
      redis:
        condition: service_healthy

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: rag-pgvector-compose
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5433:5432"  # 5433 on the host so it doesn't clash with a standalone pgvector on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: rag-prometheus
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app

  grafana:
    image: grafana/grafana:12.1.0
    container_name: rag-grafana
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  pgdata:
  promdata:
  grafanadata:
