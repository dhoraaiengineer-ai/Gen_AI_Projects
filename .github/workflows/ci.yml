name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests
        # Fully offline: fake LLM, fake embeddings, in-memory vector store. No secrets needed.
        run: pytest -q

  image:
    name: Build, smoke-test and scan image
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    services:
      pgvector:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rag
          POSTGRES_PASSWORD: rag
          POSTGRES_DB: rag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U rag -d rag"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: genai-rag-platform:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (container boots, connects to pgvector, passes readiness)
        run: |
          docker run -d --name rag --network host \
            -e ENVIRONMENT=local -e AUTH_ENABLED=false \
            -e EURI_API_KEY=dummy-not-used-at-startup \
            -e DATABASE_URL=postgresql+psycopg://rag:rag@127.0.0.1:5432/rag \
            genai-rag-platform:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/health/ready; then echo; break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health/ready
          test "$(docker inspect -f '{{.Config.User}}' genai-rag-platform:ci)" = "10001"
          curl -sf http://127.0.0.1:8000/ | grep -q "RAG Assistant"

      - name: Container logs
        if: always()
        run: docker logs rag || true

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: genai-rag-platform:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
