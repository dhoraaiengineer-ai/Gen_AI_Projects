name: "Project 6 · Docker Build Validation"

on:
  push:
    branches: [main]
    paths: ["6-AutoRAG-Architect-Self-Improving-RAG-Platform/**", ".github/workflows/p6-*.yml"]
  pull_request:
    paths: ["6-AutoRAG-Architect-Self-Improving-RAG-Platform/**", ".github/workflows/p6-*.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: 6-AutoRAG-Architect-Self-Improving-RAG-Platform

jobs:
  docker-build:
    name: Docker Compose Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose
        run: docker compose config

      - name: Build Backend Image
        run: |
          docker build -f autorag-server/Dockerfile autorag-server

      - name: Build Frontend Image
        run: |
          docker build -f autorag-client/Dockerfile autorag-client