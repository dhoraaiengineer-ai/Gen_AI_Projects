# Alembic configuration — AutoRAG Architect v3.0
# Run: cd backend && uv run alembic upgrade head
# Rollback: uv run alembic downgrade base

[alembic]
# Migration scripts location
script_location = migrations

# Do NOT set sqlalchemy.url here — loaded from DATABASE_URL env var in env.py
# sqlalchemy.url = (managed in migrations/env.py via settings.DATABASE_URL)

# File template for new migration scripts
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

# Timezone for revision timestamps
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
