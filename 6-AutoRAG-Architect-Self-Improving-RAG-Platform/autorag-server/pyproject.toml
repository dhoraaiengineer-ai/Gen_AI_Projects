[project]
name = "autorag-server"
version = "3.0.0"
description = "AutoRAG Architect — FastAPI + LangGraph backend (v3.0)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
     # Web framework
     "fastapi>=0.115.0",
     "uvicorn[standard]>=0.30.0",
     "pydantic>=2.7.0",
     "pydantic-settings>=2.3.0",
     # Agent orchestration
     "langgraph>=0.2.0",
     "langchain-core>=0.3.0",
     # Vector + database
     "supabase>=2.6.0",
     "asyncpg>=0.29.0",
     "sqlalchemy[asyncio]>=2.0.0",
     "alembic>=1.13.0",
     # Redis (async task queue + LangGraph checkpoint cache)
     "redis[hiredis]>=5.0.0",
     # Retrieval
     "cohere>=5.5.0",
     # Evaluation
     "ragas>=0.1.0",
     # Experiment tracking
     "mlflow>=2.14.0",
     # Observability (Prometheus + Grafana + CloudWatch per approved stack -- no Sentry)
     "prometheus-fastapi-instrumentator>=7.0.0",
     "structlog>=24.0.0",
     # Utilities
     "python-multipart>=0.0.9",
     "python-jose[cryptography]>=3.3.0",
     "httpx>=0.27.0",
     "tenacity>=8.4.0",
     "jinja2>=3.1.0",
     "python-dotenv>=1.0.0",
     "uuid-utils>=0.9.0",
     "langgraph-checkpoint-postgres>=2.0.0,<3.0.0",
     "numpy>=1.26.0",
     "sentence-transformers>=5.6.0",
     # AWS SDK (Deployer agent: ECS Fargate Blue/Green + ALB weight swap)
     "boto3>=1.35.0",
     # Google AI SDK (embeddings + vision OCR for scanned PDFs)
     "google-generativeai>=0.7.0",
     # PDF rendering — used by DocumentParser to convert scanned pages to images for OCR
     "pymupdf>=1.24.0",
     # Document parsing — primary parsers for PDF text extraction and DOCX
     "pypdf>=4.0.0",
     "python-docx>=1.1.0",
     # YAML config loading — config.py model_validator reads model_pricing.yaml
     "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
     # Testing
     "pytest>=8.3.0",
     "pytest-asyncio>=0.23.0",
     "pytest-cov>=5.0.0",
     "httpx>=0.27.0",            # async test client for FastAPI
     # Linting + formatting
     "ruff>=0.6.9",
     "mypy>=1.11.0",
     # Type stubs
     "types-redis>=4.6.0",
     # Security scanning
     "bandit>=1.7.0",
     "pip-audit>=2.7.0",
     # Pre-commit hooks
     "pre-commit>=3.8.0",
     "types-python-jose>=3.5.0.20260408",
     "types-pyyaml>=6.0.12.20260518",
     "boto3-stubs>=1.43.46",
]

[tool.uv]
# uv manages ALL dependencies -- do not edit requirements.txt or requirements-dev.txt.
# Install: uv sync --all-groups
# Run:     uv run uvicorn app.main:app --reload
# Test:    uv run pytest
# Lint:    uv run ruff check app && uv run mypy app

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "N", "UP", "B", "C4", "SIM", "ANN"]
ignore = [
       "E501",    # line too long -- handled by formatter
       "B008",    # function calls in default arguments (FastAPI Depends pattern)
       "N805",    # first argument not named self (Pydantic validators use cls)
       "ANN101",  # missing type annotation for self
       "ANN102",  # missing type annotation for cls
       "F821",    # undefined name -- dynamic imports in parser.py are valid
       "B904",    # within except clauses, raise with 'from err' or 'from None'
       "B025",    # try-except with duplicate exception -- nested excepts are valid
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.13"
strict = false
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Third-party packages without complete type stubs
module = [
    "langgraph.*",
    "langchain.*",
    "langchain_core.*",
    "supabase.*",
    "postgrest.*",
    "google.generativeai.*",
    "cohere.*",
    "mlflow.*",
    "prometheus_fastapi_instrumentator.*",
    "uuid_utils.*",
    "fitz",  # PyMuPDF -- no py.typed marker / stub package on PyPI
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# numpy ships stubs that use the `type` statement (Python 3.12 syntax).
# sentence_transformers pulls in torch, whose .pyi surface is huge and slow to
# walk. Skip following imports for both so mypy does not parse them at all.
module = ["numpy", "numpy.*", "sentence_transformers", "sentence_transformers.*", "torch", "torch.*"]
ignore_missing_imports = true
follow_imports = "skip"


[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
pythonpath = ["."]
markers = [
    "integration: integration tests requiring live database (skipped when DATABASE_URL unset)",
]
filterwarnings = [
       "ignore::DeprecationWarning",
]
