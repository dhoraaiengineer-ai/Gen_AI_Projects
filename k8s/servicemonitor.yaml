# Tells kube-prometheus-stack (installed by Terraform) to scrape the app's metrics port.
# The job label becomes "rag-api", matching monitoring/prometheus/alerts.yml.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: rag-api
  labels:
    app.kubernetes.io/name: rag-api
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-api
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
