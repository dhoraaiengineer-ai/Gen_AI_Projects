# Local (docker compose "monitoring" profile). In Kubernetes the ServiceMonitor does the scraping.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: medinfo
    metrics_path: /metrics
    # If METRICS_TOKEN is set on the app, mount it and uncomment:
    # authorization:
    #   credentials_file: /etc/prometheus/metrics_token
    static_configs:
      - targets: ["backend:8000"]
