apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: medinfo-backend
  namespace: medinfo
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: medinfo-backend}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
