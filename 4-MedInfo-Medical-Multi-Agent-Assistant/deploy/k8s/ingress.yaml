# AWS Load Balancer Controller (ALB). TLS terminates at the ALB with an ACM certificate (encryption in
# transit); HTTP redirects to HTTPS. Set the certificate ARN and host in CD.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medinfo-frontend
  namespace: medinfo
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    alb.ingress.kubernetes.io/certificate-arn: CERTIFICATE_ARN_PLACEHOLDER
    alb.ingress.kubernetes.io/healthcheck-path: /frontend-healthz
    # Long answers stream over SSE.
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=120
spec:
  ingressClassName: alb
  rules:
    - host: HOST_PLACEHOLDER
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medinfo-frontend
                port: {name: http}
