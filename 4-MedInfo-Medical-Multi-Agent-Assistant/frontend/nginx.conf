# Unprivileged, read-only-root friendly nginx: pid and every temp path live in /tmp.
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types { image/svg+xml svg; }

    # Questions travel in POST bodies, never in URLs, so the access log holds no question text.
    log_format main '$remote_addr - [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout main;

    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Rendered from /etc/nginx/templates/default.conf.template by the image entrypoint.
    include /tmp/default.conf;
}
