# Local orchestration (Docker Compose v2):
#   docker compose up --build                       frontend (nginx) + backend + Redis   -> http://127.0.0.1:8080
#   docker compose --profile pgvector up --build    + local Postgres/pgvector (point DATABASE_URL at it)
#   docker compose --profile monitoring up --build  + Prometheus (127.0.0.1:9090) + Grafana (127.0.0.1:3000)
# Only the frontend is published (127.0.0.1); it proxies /api to the backend. Secrets come from .env.

x-hardening: &hardening
  read_only: true
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  frontend:
    <<: *hardening
    build: ./frontend
    image: medinfo-frontend:local
    environment:
      BACKEND_UPSTREAM: backend:8000
      SUPABASE_URL: ${SUPABASE_URL:?set SUPABASE_URL in .env}
    user: "10001:10001"
    tmpfs: ["/tmp:size=16m,mode=1777"]
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      backend:
        condition: service_healthy

  backend:
    <<: *hardening
    build: ./backend
    image: medinfo-backend:local
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_FORMAT: json
      REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}@redis:6379/0
    user: "10001:10001"
    tmpfs: ["/tmp:size=64m,mode=1777"]
    # Not published: reachable only from the frontend and Prometheus on the compose network.
    expose: ["8000"]
    depends_on:
      redis:
        condition: service_healthy

  redis:
    <<: *hardening
    image: redis:7.4-alpine
    # Cache and short-term memory only: no persistence, password required, dangerous commands disabled.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      - --save
      - ""
      - --appendonly
      - "no"
      - --protected-mode
      - "yes"
      - --rename-command
      - FLUSHALL
      - ""
      - --rename-command
      - CONFIG
      - ""
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    user: "999:1000"
    tmpfs: ["/data:size=16m"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}

  pgvector:
    profiles: ["pgvector"]
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: medinfo
      POSTGRES_PASSWORD: ${LOCAL_PG_PASSWORD:?set LOCAL_PG_PASSWORD in .env}
      POSTGRES_DB: medinfo
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medinfo -d medinfo"]
      interval: 10s
      timeout: 3s
      retries: 5

  prometheus:
    profiles: ["monitoring"]
    <<: *hardening
    image: prom/prometheus:v2.53.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    read_only: false
    ports: ["127.0.0.1:9090:9090"]

  grafana:
    profiles: ["monitoring"]
    <<: *hardening
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    read_only: false
    ports: ["127.0.0.1:3000:3000"]

volumes:
  pgdata:
  promdata:
  grafanadata:
