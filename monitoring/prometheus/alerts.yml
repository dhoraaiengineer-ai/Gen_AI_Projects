# Alert rules for the RAG API. Single source of truth: loaded by the local Prometheus
# (docker compose --profile monitoring) and by kube-prometheus-stack on EKS (via Terraform).
groups:
  - name: rag-api
    rules:
      - alert: RagApiDown
        expr: absent(up{job="rag-api"} == 1)
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: No healthy RAG API instance is being scraped
          description: Prometheus has not scraped a healthy rag-api target for 2 minutes.

      - alert: RagApiHighErrorRate
        expr: |
          sum(rate(http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: More than 5% of RAG API requests are failing with 5xx
          description: "5xx ratio over 5m is {{ $value | humanizePercentage }}."

      - alert: RagApiHighLatency
        expr: |
          histogram_quantile(0.95,
            sum by (le, route) (rate(http_request_duration_seconds_bucket{route=~"/api/v1/(query|agent)"}[5m]))
          ) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency above 20s on {{ $labels.route }}"
          description: "p95 is {{ $value | humanizeDuration }}. Check the LLM provider and fallback activity."

      - alert: RagLlmUsingFallback
        expr: sum by (model) (increase(rag_llm_fallbacks_total[15m])) > 5
        labels:
          severity: warning
        annotations:
          summary: "Primary LLM failing; {{ $labels.model }} is serving traffic"
          description: More than 5 calls in 15m were served by a fallback model. Usually the primary model's daily quota is exhausted or the provider is degraded.

      - alert: RagLlmErrors
        expr: sum by (kind) (increase(rag_llm_errors_total[10m])) > 3
        labels:
          severity: warning
        annotations:
          summary: "LLM requests failing after fallbacks ({{ $labels.kind }})"
          description: Users are getting errors because both the primary and the fallback model failed.

      - alert: RagAuthFailureSpike
        expr: sum(rate(auth_failures_total{reason="invalid_token"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: Sustained invalid-token requests
          description: More than 1 invalid token per second for 10 minutes. Either a misconfigured client or someone probing the API.

      - alert: RagNoReadyReplicas
        # kube-state-metrics only exists in Kubernetes; locally this rule simply has no data.
        expr: kube_deployment_status_replicas_available{deployment="rag-api"} < 1
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: rag-api has no ready replicas
          description: Every pod is failing readiness, usually because the database is unreachable.

  - name: rag-guardrails
    rules:
      - alert: RagGuardrailAttackSpike
        expr: |
          sum(increase(rag_guardrail_events_total{stage="input", action="block", check=~"prompt_injection|jailbreak"}[10m])) > 20
        labels:
          severity: warning
        annotations:
          summary: Spike in blocked prompt-injection / jailbreak attempts
          description: "{{ $value }} attempts blocked in 10 minutes. Check the audit log (\"guardrail triggered\") for the users involved."

      - alert: RagSecretsInQuestions
        expr: sum(increase(rag_guardrail_events_total{stage="input", check="secrets"}[1h])) > 0
        labels:
          severity: info
        annotations:
          summary: A user pasted an API key or credential into a question
          description: The question was blocked; consider asking the user to rotate the credential.

      - alert: RagHallucinationFlagsHigh
        expr: |
          sum(increase(rag_hallucination_flags_total[30m]))
            / clamp_min(sum(increase(http_requests_total{route="/api/v1/query", status="200"}[30m])), 1) > 0.2
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: More than 20% of answers fail the grounding check
          description: Retrieval or the model may be degraded (a fallback model in use?). Run an evaluation.

      - alert: RagLlmCircuitOpen
        expr: max by (breaker) (rag_circuit_state) == 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "LLM circuit {{ $labels.breaker }} has been open for 10 minutes"
          description: The provider keeps failing (quota, outage or rate limit); traffic is on the fallback chain.

      - alert: RagLlmLatencyP99High
        expr: |
          histogram_quantile(0.99, sum by (le, model) (rate(rag_llm_latency_seconds_bucket[10m]))) > 30
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "p99 LLM latency above 30s for {{ $labels.model }}"
